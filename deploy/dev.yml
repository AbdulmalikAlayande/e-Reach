services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ereach
    ports: ["5433:5432"]
    volumes:
      - pgdata:/var/lib/postgresql
      - ./dev-init.sql:/docker-entrypoint-initdb.d/01-roles.sql:ro
volumes:
  pgdata: {}
